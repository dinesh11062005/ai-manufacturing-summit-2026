<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Manufacturing Summit 2026</title>
  </head>

  <body>
    <!-- Hidden form for Netlify form detection -->
    <form
      name="summit-registration"
      method="POST"
      action="/thank-you"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="summit-registration" />
      <input name="fullName" />
      <input name="email" />
      <input name="phone" />
      <input name="occupation" />
      <input name="organization" />
      <input name="consent" />
      <input name="bot-field" />
    </form>

    <!-- React application -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
